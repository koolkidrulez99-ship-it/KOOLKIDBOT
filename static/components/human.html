<!-- HUMAN MODE -->
<div class="card">
    <h3>🧑 HUMAN MODE: MULTIPLIERS + ORDER BLOCK</h3>

    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
        <div style="flex:1; min-width:220px;">
            <div style="color:#94a3b8; font-size:13px; margin-left:6px;">Stake</div>
            <input id="stake" type="number" value="1" min="0.35" step="0.35" style="width:100%;">
        </div>
        <!-- Barrier input removed as requested -->
    </div>

    <!-- TP/SL -->
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:10px;">
        <div style="flex:1; min-width:220px;">
            <div style="color:#94a3b8; font-size:13px; margin-left:6px;">Take Profit (TP)</div>
            <input id="tp" type="number" value="0" step="0.1" style="width:100%;">
        </div>
        <div style="flex:1; min-width:220px;">
            <div style="color:#94a3b8; font-size:13px; margin-left:6px;">Stop Loss (SL)</div>
            <input id="sl" type="number" value="0" step="0.1" style="width:100%;">
        </div>
    </div>

    <div style="margin-top:8px;">
        <button id="autoSlBtn" onclick="toggleAutoSL()" style="background:#facc15; width:100%;">
            AUTO SL: ON
        </button>
    </div>

    <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;">
        <button onclick="manualTP()" style="background:#22c55e; flex:1;">SET TP</button>
        <button onclick="manualSL()" style="background:#ef4444; flex:1;">SET SL</button>
    </div>

    <!-- humanX BUTTON -->
    <div style="margin-top:15px;">
        <button id="humanXBtn" onclick="humanX()" style="background:#22c55e; width:100%; font-size:1.2rem; padding:12px;">
            ⚡ humanX (Order Block Trade)
        </button>
    </div>

    <!-- CHART (without live tick) -->
    <div style="margin-top:20px; background:#0f172a; border-radius:12px; padding:10px;">
        <div id="humanChart" style="width:100%; height:300px;"></div>
        <div id="chartPlaceholder" style="text-align:center; color:#94a3b8; padding:10px; display:none;">
            Building 1-hour candles... please wait.
        </div>
    </div>

    <div style="margin-top:10px; text-align:center; color:#64748b;">
        HUMAN MODE: Order Block strategy based on 1-hour range.
    </div>
</div>

<!-- ✅ NEW: Trade History card (same style as KOOLKID/JOKERJOE) -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
    <h3 style="margin:0;">📚 TRADE HISTORY</h3>
    <button onclick="clearProfileHistory()" style="background:#fb7185;">Clear History</button>
  </div>

  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:12px;">
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Total Trades</div>
      <div id="profileTotalTrades" style="font-size:22px; font-weight:bold;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Wins</div>
      <div id="profileWins" style="font-size:22px; font-weight:bold; color:#22c55e;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Losses</div>
      <div id="profileLosses" style="font-size:22px; font-weight:bold; color:#ef4444;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Win Rate</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8;">
        <span id="profileWinRate">0%</span>
        <div style="font-size:12px; color:#94a3b8;">Loss Rate: <span id="profileLossRate">0%</span></div>
      </div>
    </div>
  </div>

  <div id="profileTradeList" style="margin-top:14px;">
    <div style="text-align:center; color:#64748b; padding:20px;">No trades yet</div>
  </div>
</div>

<!-- Lightweight Charts library -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
    // Chart variables
    let chart = null;
    let candleSeries = null;
    let rangeHighLine = null;
    let rangeLowLine = null;

    function initHumanChart() {
        if (chart) return;
        const container = document.getElementById('humanChart');
        if (!container) return;
        chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: 300,
            layout: {
                backgroundColor: '#0f172a',
                textColor: '#cbd5e1',
            },
            grid: {
                vertLines: { color: '#334155' },
                horzLines: { color: '#334155' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: false,
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444',
        });

        rangeHighLine = candleSeries.createPriceLine({
            price: 0,
            color: '#38bdf8',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: 'Range High',
        });

        rangeLowLine = candleSeries.createPriceLine({
            price: 0,
            color: '#f97316',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: 'Range Low',
        });
    }

    function updateHumanChart(data) {
        if (!candleSeries) initHumanChart();
        if (!candleSeries) return;

        if (data.candles.length === 0) {
            document.getElementById('chartPlaceholder').style.display = 'block';
        } else {
            document.getElementById('chartPlaceholder').style.display = 'none';
            candleSeries.setData(data.candles);
            if (data.range_high) rangeHighLine.applyOptions({ price: data.range_high });
            if (data.range_low) rangeLowLine.applyOptions({ price: data.range_low });
        }
    }

    window.updateHumanChart = updateHumanChart;

    window.addEventListener('resize', () => {
        if (chart) {
            chart.applyOptions({ width: document.getElementById('humanChart').clientWidth });
        }
    });
</script>
