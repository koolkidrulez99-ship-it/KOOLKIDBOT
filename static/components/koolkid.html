<div class="card">
  <h3 style="margin-top:0;">⚙️ KOOLKID CONTROL PANEL</h3>

  <div style="display:grid; grid-template-columns: 1.15fr 1.85fr; gap:14px; align-items:start;">
    <!-- LEFT: inputs + tp/sl bars + confidence -->
    <div>
      <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; align-items:center;">
          <div>
            <div style="color:#94a3b8; font-size:12px;">Stake</div>
            <input id="stake" type="number" min="0.35" step="0.01" value="1" style="width:100%;">
          </div>
          <div>
            <div style="color:#94a3b8; font-size:12px;">Barrier</div>
            <input id="barrier" type="number" min="0" max="9" step="1" value="5" style="width:100%;">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
          <div>
            <div style="color:#94a3b8; font-size:12px;">Take Profit (TP)</div>
            <input id="tp" type="number" step="0.01" value="0" style="width:100%;">
          </div>
          <div>
            <div style="color:#94a3b8; font-size:12px;">Stop Loss (SL)</div>
            <input id="sl" type="number" step="0.01" value="0" style="width:100%;">
          </div>
        </div>

        <button onclick="manualTP()" style="width:100%; margin-top:10px; height:46px; background:linear-gradient(90deg,#16a34a,#22c55e); border-radius:12px;">
          SET TP
        </button>

        <button id="autoSlBtn" onclick="toggleAutoSL()" style="width:100%; margin-top:8px; height:46px; background:#facc15; color:#0b1220; border-radius:12px;">
          AUTO SL: ON
        </button>

        <button onclick="manualSL()" style="width:100%; margin-top:8px; height:46px; background:linear-gradient(90deg,#fb7185,#ef4444); border-radius:12px;">
          SET SL
        </button>
      </div>

      <div style="margin-top:12px;">
        <div style="font-weight:bold; margin-bottom:8px;">📊 Confidence Bars</div>
        <div class="confidence-wrap">
          <div class="conf-item">
            <div style="display:flex; justify-content:space-between;">
              <span>OVER 1</span><span><b id="confOver1Text">0</b>%</span>
            </div>
            <div class="conf-bar-bg"><div id="confOver1" class="conf-bar-fill"></div></div>
          </div>
          <div class="conf-item">
            <div style="display:flex; justify-content:space-between;">
              <span>OVER 2</span><span><b id="confOver2Text">0</b>%</span>
            </div>
            <div class="conf-bar-bg"><div id="confOver2" class="conf-bar-fill"></div></div>
          </div>
          <div class="conf-item">
            <div style="display:flex; justify-content:space-between;">
              <span>UNDER 8</span><span><b id="confUnder8Text">0</b>%</span>
            </div>
            <div class="conf-bar-bg"><div id="confUnder8" class="conf-bar-fill"></div></div>
          </div>
          <div class="conf-item">
            <div style="display:flex; justify-content:space-between;">
              <span>UNDER 9</span><span><b id="confUnder9Text">0</b>%</span>
            </div>
            <div class="conf-bar-bg"><div id="confUnder9" class="conf-bar-fill"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px;">
        <div style="font-weight:bold; margin-bottom:8px;">🔢 Digit Analysis</div>
        <div id="digitGrid" class="digit-grid"></div>
      </div>

      <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
        <!-- ✅ requested colors + emojis + text -->
        <button onclick="take3('UNDER')" style="width:100%; height:46px; background:#f97316;">🔥 TAKE 3 UNDER NOW</button>
        <button onclick="take3('OVER')" style="width:100%; height:46px; background:#1d4ed8;">🔥 TAKE 3 OVER NOW</button>

        <button onclick="burst4('UNDER')" style="width:100%; height:46px; background:#f97316;">⚡ BURST 4 UNDER FAST</button>
        <button onclick="burst4('OVER')" style="width:100%; height:46px; background:#1d4ed8;">⚡ BURST 4 OVER FAST</button>

        <button id="kidracksBtn" onclick="toggleKidracksAuto()" style="width:100%; height:46px; background:#1e293b;">
          KIDRACKS AUTO TRADE: OFF
        </button>

        <button id="koolkidspeedBtn" onclick="toggleKoolkidspeedAuto()" style="width:100%; height:46px; background:#1e293b;">
          KOOLKIDSPEED AUTO: OFF
        </button>

        <button id="koolluckBtn" onclick="toggleKoolluckAuto()" style="width:100%; height:46px; background:#1e293b;">
          KOOL🍀KID LUCK: OFF
        </button>

        <button id="autoBtn" onclick="toggleAuto()" style="width:100%; height:52px; background:#38bdf8;">
          AUTO OFF
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ✅ Trade History card (name only change) -->
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
    <h3 style="margin:0;">📚 TRADE HISTORY</h3>
    <button onclick="clearProfileHistory()" style="background:#fb7185;">Clear History</button>
  </div>

  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:12px;">
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Total Trades</div>
      <div id="profileTotalTrades" style="font-size:22px; font-weight:bold;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Wins</div>
      <div id="profileWins" style="font-size:22px; font-weight:bold; color:#22c55e;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Losses</div>
      <div id="profileLosses" style="font-size:22px; font-weight:bold; color:#ef4444;">0</div>
    </div>
    <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; text-align:center;">
      <div style="color:#94a3b8; font-size:12px;">Win Rate</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8;">
        <span id="profileWinRate">0%</span>
        <div style="font-size:12px; color:#94a3b8;">Loss Rate: <span id="profileLossRate">0%</span></div>
      </div>
    </div>
  </div>

  <div id="profileTradeList" style="margin-top:14px;">
    <div style="text-align:center; color:#64748b; padding:20px;">No trades yet</div>
  </div>
</div>
