<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/static/images/favicon.png">
    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .box{
            width:420px;
            padding:25px;
            background:#111827;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.6);
        }
        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:10px;
            border:none;
            background:#1f2937;
            color:white;
            box-sizing:border-box;
        }
        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            font-weight:bold;
            cursor:pointer;
        }
        a{color:#38bdf8;}
        .err{color:#ef4444;}
        .ok{color:#22c55e;}
        .hint{color:#94a3b8; font-size:13px; margin-top:-4px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Forgot Password</h2>
        <p class="hint">Enter your username and linked license key. If they match, the next page lets you set a new password.</p>

        {% if error %}
        <p class="err">{{error}}</p>
        {% endif %}

        {% if success %}
        <p class="ok">{{success}}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="username" placeholder="Enter your username" value="{{ entered_username or entered_email or '' }}" required>
            <input type="text" name="license_key" placeholder="Enter linked license key" value="{{ entered_license_key or '' }}" required>
            <button type="submit">Continue</button>
        </form>

        <p style="margin-top:15px;">
            <a href="/login">Back to Login</a>
        </p>
    </div>
</body>
</html>
