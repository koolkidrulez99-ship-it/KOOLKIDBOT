<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            width:400px;
            padding:25px;
            background:#111827;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.6);
        }
        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:10px;
            border:none;
            background:#1f2937;
            color:white;
        }
        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            font-weight:bold;
            cursor:pointer;
        }
        a{color:#38bdf8;}
        .err{color:#ef4444;}
        .ok{color:#22c55e;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Forgot Password</h2>

        {% if error %}
        <p class="err">{{error}}</p>
        {% endif %}

        {% if success %}
        <p class="ok">{{success}}</p>
        {% endif %}

        <form method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <p style="margin-top:15px;">
            <a href="/login">Back to Login</a>
        </p>
    </div>
</body>
</html>
