<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .box{
            width:420px;
            padding:25px;
            background:#111827;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.6);
        }
        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:10px;
            border:none;
            background:#1f2937;
            color:white;
            box-sizing:border-box;
        }
        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            font-weight:bold;
            cursor:pointer;
        }
        .err{color:#ef4444;}
        .ok{color:#22c55e;}
        a{color:#38bdf8;}
        .hint{color:#94a3b8; font-size:13px; margin-top:-4px;}

        .pw-wrap{
            position:relative;
            margin-top:10px;
        }
        .pw-wrap input{
            margin-top:0;
            padding-right:44px;
        }
        .pw-eye{
            position:absolute;
            right:8px;
            top:50%;
            transform:translateY(-50%);
            border:none;
            background:transparent;
            color:#cbd5e1;
            cursor:pointer;
            font-size:18px;
            line-height:1;
            padding:4px 6px;
            width:auto;
            margin-top:0;
        }

    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Password</h2>
        <p class="hint">A matching linked license key is required to complete password reset.</p>

        {% if error %}
        <p class="err">{{error}}</p>
        {% endif %}

        {% if success %}
        <p class="ok">{{success}}</p>
        <p style="margin-top:12px;"><a href="/login">Back to Login</a></p>
        {% else %}
        <form method="POST">
            {% if token %}
            <input type="hidden" name="token" value="{{ token }}">
            <div style="color:#94a3b8; font-size:12px; margin-top:6px;">Reset token detected ✅</div>
            {% else %}
            <input type="text" name="token" placeholder="Paste reset token/link token" required>
            {% endif %}

            <input type="text" name="license_key" placeholder="Enter linked license key" value="{{ entered_license_key or '' }}" required>

            <div class="pw-wrap">
                <input id="resetPasswordField" type="password" name="password" placeholder="New strong password" required>
                <button type="button" class="pw-eye" aria-label="Show password" onclick="togglePw('resetPasswordField', this)">👁️</button>
            </div>

            <div class="pw-wrap">
                <input id="resetConfirmPasswordField" type="password" name="confirm_password" placeholder="Confirm new password" required>
                <button type="button" class="pw-eye" aria-label="Show password" onclick="togglePw('resetConfirmPasswordField', this)">👁️</button>
            </div>

            <button type="submit">Reset Password</button>
        </form>

        <p style="margin-top:15px;">
            <a href="/login">Back to Login</a> &nbsp;|&nbsp; <a href="/forgot_password">Forgot Password</a>
        </p>
        {% endif %}
    </div>

    <script>
        function togglePw(id, btn){
            const input = document.getElementById(id);
            if(!input) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.textContent = isHidden ? '🙈' : '👁️';
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        }
    </script>

</body>
</html>
