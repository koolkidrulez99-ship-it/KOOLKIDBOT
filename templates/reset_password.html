<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            width:400px;
            padding:25px;
            background:#111827;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.6);
        }
        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:10px;
            border:none;
            background:#1f2937;
            color:white;
        }
        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            font-weight:bold;
            cursor:pointer;
        }
        .err{color:#ef4444;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Password</h2>

        {% if error %}
        <p class="err">{{error}}</p>
        {% endif %}

        <form method="POST">
            <input type="password" name="password" placeholder="New strong password" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
