<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOOLKID AI BOT</title>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
    body{
        background:linear-gradient(135deg,#0f172a,#020617);
        font-family:Arial, sans-serif;
        color:white;
        margin:0;
        padding:20px;
    }
    .container{
        max-width:1100px;
        margin:auto;
        padding:20px;
    }
    h1{
        text-align:center;
        color:#38bdf8;
        text-shadow:0 0 20px #38bdf8;
    }
    .card{
        background:#111827;
        padding:20px;
        border-radius:15px;
        margin:15px 0;
        box-shadow:0 0 25px rgba(0,0,0,0.6);
        position:relative;
    }
    button{
        padding:10px 20px;
        margin:5px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-weight:bold;
        transition:0.2s;
        color:white;
    }
    button:hover{transform:scale(1.05);}
    input, select{
        padding:8px;
        margin:5px;
        border-radius:8px;
        border:none;
        background:#1f2937;
        color:white;
    }
    .green{color:#22c55e;}
    .red{color:#ef4444;}
    .blue{color:#38bdf8;}
    .digit-stream{
        font-size:22px;
        letter-spacing:5px;
        text-align:center;
        padding:10px;
        background:#0f172a;
        border-radius:10px;
        margin-top:10px;
        max-height:60px;
        overflow:hidden;
    }
    .profile-btn {
        font-size: 1.5rem;
        padding: 15px 30px;
        margin: 10px;
        border-radius: 15px;
        font-weight: bold;
        transition: 0.3s;
    }
    .koolkid-btn {background: #38bdf8; box-shadow: 0 0 20px #38bdf8;}
    .jokerjoe-btn {background: #a855f7; box-shadow: 0 0 20px #a855f7;}
    .human-btn {background: #22c55e; box-shadow: 0 0 20px #22c55e;}
    .profile-btn.active {transform: scale(1.05); border: 2px solid white;}
    .profile-btn:not(.active) {opacity: 0.7;}
    .tick-box{
        width:80px;
        height:60px;
        background:#1e3a8a;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:2rem;
        font-weight:bold;
        box-shadow:0 0 15px rgba(56,189,248,0.7);
    }
    .pnl-box{
        width:160px;
        height:60px;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:1.4rem;
        font-weight:bold;
        background:#0f172a;
        border:2px solid #334155;
    }
    .confidence-wrap{
        margin-top:15px;
        display:grid;
        grid-template-columns: repeat(2, 1fr);
        gap:10px;
    }
    .conf-item{
        background:#0f172a;
        padding:12px;
        border-radius:12px;
        border:1px solid #334155;
    }
    .conf-bar-bg{
        width:100%;
        background:#1f2937;
        border-radius:10px;
        overflow:hidden;
        margin-top:6px;
        height:18px;
    }
    .conf-bar-fill{
        height:18px;
        width:0%;
        background:linear-gradient(90deg,#ef4444,#facc15,#22c55e);
        transition:0.3s;
    }
    .digit-grid{
        display:grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 15px;
    }
    .digit-cell{
        background:#1f2937;
        padding:10px;
        border-radius:10px;
        text-align:center;
        border:2px solid #374151;
        transition:0.2s;
        cursor:pointer;
        user-select:none;
    }
    .digit-cell.flash{
        border-color:#ef4444;
        box-shadow:0 0 18px #ef4444;
        transform:scale(1.05);
    }
    .digit-popup{
        position:fixed;
        z-index:9999;
        background:#111827;
        border:1px solid #334155;
        border-radius:12px;
        box-shadow:0 0 25px rgba(0,0,0,0.6);
        padding:10px;
        display:none;
        min-width:180px;
    }
    .digit-popup h4{
        margin:0 0 8px 0;
        color:#38bdf8;
        font-size:14px;
    }
    .digit-popup button{
        width:100%;
        margin:6px 0;
    }

    /* =================== TOAST NOTIFICATIONS =================== */
    #toastContainer{
        position:fixed;
        top:15px;
        right:15px;
        z-index:999999; /* raised */
        display:flex;
        flex-direction:column;
        gap:10px;
        width:300px;
        pointer-events:none;
    }
    .toast{
        background:#111827;
        border:1px solid #334155;
        border-radius:12px;
        padding:12px 14px;
        box-shadow:0 0 25px rgba(0,0,0,0.7);
        font-weight:bold;
        font-size:14px;
        opacity:0;
        transform:translateX(40px);
        transition:0.35s;
        pointer-events:none;
    }
    .toast.show{
        opacity:1;
        transform:translateX(0px);
    }
    .toast.success{border-color:#22c55e; color:#22c55e;}
    .toast.error{border-color:#ef4444; color:#ef4444;}
    .toast.warn{border-color:#facc15; color:#facc15;}
    .toast.info{border-color:#38bdf8; color:#38bdf8;}

    /* =================== HOW TO USE PANEL (KEEP NEW) =================== */
    .api-grid{
        display:flex;
        gap:15px;
        flex-wrap:wrap;
        align-items:flex-start;
    }
    .api-left{
        flex:1;
        min-width:340px;
    }
    .api-right{
        width:360px;
        max-width:100%;
        background:#0f172a;
        border:1px solid #334155;
        border-radius:12px;
        padding:12px;
        box-shadow:0 0 18px rgba(0,0,0,0.35);
    }
    .howto-title{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        font-weight:bold;
        color:#38bdf8;
        margin-bottom:8px;
    }
    .howto-title button{
        padding:6px 10px;
        border-radius:10px;
        background:#1f2937;
        color:#cbd5e1;
        font-size:12px;
    }
    .howto-body{
        font-size:12px;
        color:#cbd5e1;
        line-height:1.4;
        max-height:260px;
        overflow:auto;
        padding-right:6px;
    }
    .howto-body ul{
        margin:8px 0 0 18px;
        padding:0;
    }
    .howto-body li{
        margin:6px 0;
    }
    .howto-badge{
        display:inline-block;
        padding:2px 8px;
        border:1px solid #334155;
        border-radius:999px;
        font-size:11px;
        color:#94a3b8;
        margin-left:6px;
    }

    /* ===== TRADE HISTORY ITEMS (KEEP NEW STYLE) ===== */
    .trade-item {
        background:#0f172a;
        border-radius:12px;
        padding:12px;
        border-left:6px solid;
        display:flex;
        flex-direction:column;
        gap:6px;
        font-size:14px;
        margin-bottom:8px;
    }
    .trade-item.win { border-left-color:#22c55e; }
    .trade-item.loss { border-left-color:#ef4444; }
    .trade-row {
        display:flex;
        flex-wrap:wrap;
        justify-content:space-between;
        align-items:center;
    }
    .trade-type {
        font-weight:bold;
        background:#1f2937;
        padding:2px 10px;
        border-radius:20px;
        font-size:13px;
    }
    .trade-profit {
        font-weight:bold;
        font-size:15px;
    }
    .trade-profit.win { color:#22c55e; }
    .trade-profit.loss { color:#ef4444; }
    .trade-detail {
        display:flex;
        gap:15px;
        color:#94a3b8;
        font-size:13px;
    }
    .exit-digit {
        background:#1e293b;
        padding:2px 8px;
        border-radius:16px;
        color:#facc15;
        font-weight:bold;
    }
</style>
</head>

<body>
<div id="toastContainer"></div>

<div class="container">

    <h1>KOOLKID AI TRADING ENGINE</h1>
    <a href="/logout" style="color:#ef4444; font-weight:bold;">Logout</a>

    <!-- PROFILE -->
    <div class="card" style="text-align:center;">
        <h3>🎮 SELECT PROFILE</h3>
        <button id="koolkidBtn" class="profile-btn koolkid-btn active" onclick="setProfile('KOOLKID')">🔵 KOOLKID</button>
        <button id="jokerjoeBtn" class="profile-btn jokerjoe-btn" onclick="setProfile('JOKERJOE')">🃏 JOKERJOE</button>
        <button id="humanBtn" class="profile-btn human-btn" onclick="setProfile('HUMAN')">🧑 HUMAN</button>

        <h4 id="profileTitle" style="margin-top:10px; color:#38bdf8;">KOOLKID MODE: OVER & UNDER</h4>
    </div>

    <!-- API -->
    <div class="card">
        <h3>🔌 API CONNECTION</h3>

        <div class="api-grid">
            <div class="api-left">
                <input id="token" placeholder="Enter API Token" type="password" style="width:40%;">
                <button onclick="connect()" style="background:#38bdf8;">Connect</button>
                <button onclick="disconnect()" style="background:#ef4444;">Disconnect</button>

                <select id="symbol"></select>

                <p>Status: <span id="apiStatus" class="red">Not Connected</span></p>
            </div>

            <div class="api-right" id="howToUsePanel">
                <div class="howto-title">
                    <div>
                        📘 HOW TO USE
                        <span class="howto-badge" id="howtoModeBadge">KOOLKID</span>
                    </div>
                    <button id="howtoToggleBtn" onclick="toggleHowTo()">HIDE</button>
                </div>
                <div class="howto-body" id="howtoBody"></div>
            </div>
        </div>
    </div>

    <!-- ACCOUNT DASHBOARD -->
    <div class="card" id="accountDashboard" style="display:none;">
        <h3>💰 ACCOUNT DASHBOARD</h3>

        <div style="display:flex; justify-content:space-between; align-items:center; gap:15px;">
            <div>
                <div style="color:#94a3b8;">Balance</div>
                <div style="font-size:2rem; font-weight:bold; color:#38bdf8;">
                    $<span id="balance">0</span>
                </div>
            </div>

            <div>
                <div style="color:#94a3b8;">Net P&L</div>
                <div id="netPnlBox" class="pnl-box">$0.00</div>
            </div>
        </div>
    </div>

    <!-- LIVE TICK INFO -->
    <div class="card">
        <h3>📍 LIVE TICK INFO</h3>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <div style="color:#94a3b8;">Last Digit</div>
                <div id="lastDigitBox" class="tick-box">-</div>
            </div>

            <div>
                <div style="color:#94a3b8;">Tick Count</div>
                <div style="font-size:2rem; font-weight:bold; color:#facc15;">
                    <span id="tickCount">0</span>
                </div>
            </div>
        </div>

        <div class="digit-stream" id="digitStream">-</div>
    </div>

    <!-- PROFILE UI LOADS HERE -->
    <div id="profileContainer"></div>

</div>

<!-- digit popup -->
<div id="digitPopup" class="digit-popup">
    <h4 id="popupTitle">Digit</h4>
    <button id="popupBtn1" style="background:#38bdf8;" onclick="popupTrade('OVER')">TAKE OVER</button>
    <button id="popupBtn2" style="background:#22c55e;" onclick="popupTrade('UNDER')">TAKE UNDER</button>
</div>

<!-- AUTO BARRIER POPUP -->
<div id="autoBarrierPopup" class="digit-popup" style="display:none;">
    <h4 id="autoBarrierTitle">Set Barrier</h4>
    <input id="autoBarrierInput" type="number" min="0" max="9"
           style="width:100%; margin-bottom:8px; padding:6px; border-radius:8px; border:none; background:#1f2937; color:white;">
    <button id="autoBarrierConfirm" style="background:#22c55e; width:100%; margin-top:4px;">CONFIRM</button>
    <button id="autoBarrierCancel" style="background:#ef4444; width:100%; margin-top:4px;">CANCEL</button>
</div>

<script>
const socket = io();

let activeProfile = "KOOLKID";
let digitBuffer = [];
let lastClickedDigit = null;
let apiConnected = false;

let autoSL = true;

const apiStatus = document.getElementById("apiStatus");
const balanceDisplay = document.getElementById("balance");
const netPnlBox = document.getElementById("netPnlBox");

const lastDigitBox = document.getElementById("lastDigitBox");
const tickCountEl = document.getElementById("tickCount");
const digitStream = document.getElementById("digitStream");

const accountDashboard = document.getElementById("accountDashboard");
const profileTitle = document.getElementById("profileTitle");

// -------------------- Trade store (FIX: history persists across switching) --------------------
const tradeStore = { KOOLKID: [], JOKERJOE: [], HUMAN: [] };

function renderTradeList(profile){
    const list = document.getElementById("profileTradeList");
    if(!list) return;

    const arr = tradeStore[profile] || [];
    if(arr.length === 0){
        list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">No trades yet</div>';
        return;
    }

    list.innerHTML = "";
    arr.slice().reverse().forEach(t => {
        const item = buildTradeItem(t);
        list.appendChild(item);
    });
}

function buildTradeItem(trade){
    const result = (trade.result || "LOSS").toUpperCase();
    const profit = typeof trade.profit === 'number' ? trade.profit : (trade.profit_value || 0);
    const typeRaw = trade.type || trade.contract_type || "UNKNOWN";
    const barrier = (trade.barrier !== undefined && trade.barrier !== null) ? trade.barrier : "";
    const type = (barrier !== "" ? `${typeRaw} ${barrier}` : typeRaw);
    const stake = trade.stake || trade.buy_price || 0;

    // ✅ EXIT DIGIT FIX: supports exit_digit injected by backend
    const exitDigit = (trade.exitDigit !== undefined && trade.exitDigit !== null)
        ? trade.exitDigit
        : ((trade.exit_digit !== undefined && trade.exit_digit !== null) ? trade.exit_digit : "?");

    const time = trade.time || new Date().toLocaleTimeString();

    const item = document.createElement('div');
    item.className = `trade-item ${result.toLowerCase()}`;

    const profitDisplay = (result === 'WIN' ? '+' : '-') + '$' + Math.abs(profit).toFixed(2);

    item.innerHTML = `
        <div class="trade-row">
            <span class="trade-type">${type}</span>
            <span class="trade-profit ${result.toLowerCase()}">${profitDisplay}</span>
        </div>
        <div class="trade-row">
            <span style="color:#94a3b8;">Stake: $${Number(stake).toFixed(2)}</span>
            <span class="exit-digit">Exit: ${exitDigit}</span>
        </div>
        <div class="trade-detail">
            <span>${time}</span>
        </div>
    `;
    return item;
}

function pushTradeToStore(trade){
    const p = (trade.profile || activeProfile || "KOOLKID").toUpperCase();
    if(!tradeStore[p]) tradeStore[p] = [];
    tradeStore[p].push(trade);
    if(tradeStore[p].length > 250) tradeStore[p].shift();
}

// Dynamic profile elements (loaded from modular HTML)
let stakeInput;
let barrierInput;
let tpInput;
let slInput;
let digitGrid;

// differs analysis (OLD UI style)
let differsAnalysisBox;
let differsDigitsRow;

// Insta5
let insta5Wrap;
let insta5Btn;

// Confidence bars
let confOver1;
let confOver2;
let confUnder8;
let confUnder9;

let confOver1Text;
let confOver2Text;
let confUnder8Text;
let confUnder9Text;

const digitPopup = document.getElementById("digitPopup");
const popupTitle = document.getElementById("popupTitle");

// auto barrier popup
const autoBarrierPopup = document.getElementById("autoBarrierPopup");
const autoBarrierTitle = document.getElementById("autoBarrierTitle");
const autoBarrierInput = document.getElementById("autoBarrierInput");
const autoBarrierConfirm = document.getElementById("autoBarrierConfirm");
const autoBarrierCancel = document.getElementById("autoBarrierCancel");
let currentAutoBarrierMode = null;

// How To Use (KEEP NEW)
const howtoBody = document.getElementById("howtoBody");
const howtoBadge = document.getElementById("howtoModeBadge");
const howtoToggleBtn = document.getElementById("howtoToggleBtn");
let howtoVisible = true;

// ================== PROFILE UI LOADER ==================
async function loadProfileUI(profile){
    let file = "koolkid.html";
    if(profile === "KOOLKID") file = "koolkid.html";
    if(profile === "JOKERJOE") file = "jokerjoe.html";
    if(profile === "HUMAN") file = "human.html";

    const res = await fetch(`/static/components/${file}`);
    const html = await res.text();

    document.getElementById("profileContainer").innerHTML = html;

    refreshDynamicElements();
    initDigitGrid();
    refreshHowTo();
    updateInsta5Label();
    syncAutoStake();
    sendRiskControls();

    // IMPORTANT FIX: re-render correct profile history after UI swaps
    renderTradeList(activeProfile);
}

// ================== REFRESH DYNAMIC ELEMENTS ==================
function refreshDynamicElements(){
    stakeInput = document.getElementById("stake");
    barrierInput = document.getElementById("barrier");

    tpInput = document.getElementById("tp");
    slInput = document.getElementById("sl");

    digitGrid = document.getElementById("digitGrid");

    differsAnalysisBox = document.getElementById("differsAnalysisBox");
    differsDigitsRow = document.getElementById("differsDigitsRow");

    insta5Wrap = document.getElementById("insta5Wrap");
    insta5Btn = document.getElementById("insta5Btn");

    confOver1 = document.getElementById("confOver1");
    confOver2 = document.getElementById("confOver2");
    confUnder8 = document.getElementById("confUnder8");
    confUnder9 = document.getElementById("confUnder9");

    confOver1Text = document.getElementById("confOver1Text");
    confOver2Text = document.getElementById("confOver2Text");
    confUnder8Text = document.getElementById("confUnder8Text");
    confUnder9Text = document.getElementById("confUnder9Text");

    if(stakeInput){
        stakeInput.addEventListener("change", syncAutoStake);
        stakeInput.addEventListener("blur", syncAutoStake);
    }

    if(barrierInput){
        barrierInput.addEventListener("change", updateInsta5Label);
        barrierInput.addEventListener("blur", updateInsta5Label);
    }

    const btn = document.getElementById("autoSlBtn");
    if(btn){
        btn.innerText = autoSL ? "AUTO SL: ON" : "AUTO SL: OFF";
        btn.style.background = autoSL ? "#facc15" : "#64748b";
    }
}

// ================== HOW TO USE (KEEP NEW EXACTLY) ==================
function getHowToHTMLForProfile(profile) {
    if (profile === "KOOLKID") {
        return `
            <div style="color:#94a3b8; margin-bottom:8px;">
                Welcome to KOOLKID mode – designed for digit-based trading.
            </div>
            <ul>
                <li><b>Digit Grid:</b> Click any digit (0–9) to set it as your barrier and open a popup with quick trade options.</li>
                <li><b>Stake:</b> Your trade amount in USD. Minimum 0.35.</li>
                <li><b>Barrier:</b> The digit you are trading on (0–9). Can be set manually or by clicking the grid.</li>
                <li><b>TAKE 3 UNDER / OVER:</b> Places three consecutive trades of the selected type.</li>
                <li><b>BURST 4 UNDER / OVER:</b> Places four quick trades of the selected type.</li>
                <li><b>KIDRACKS AUTO:</b> Automated mode that triggers trades based on the selected barrier. Click once to set barrier, again to toggle on/off.</li>
                <li><b>KOOLKIDSPEED AUTO:</b> Faster automated mode with barrier selection.</li>
                <li><b>KOOL🍀KID LUCK:</b> Cycles through a preset sequence of trades each time the relevant digit appears.</li>
                <li><b>Master Auto:</b> Global on/off for all automated modes.</li>
                <li><b>TP/SL:</b> Set take-profit and stop-loss levels (in USD). AUTO SL toggles automatic stop-loss.</li>
            </ul>
        `;
    }
    if (profile === "JOKERJOE") {
        return `
            <div style="color:#94a3b8; margin-bottom:8px;">
                JOKERJOE mode – for advanced digit strategies.
            </div>
            <ul>
                <li><b>Digit Grid:</b> Click a digit to set your barrier and open a popup for MATCHES/DIFFERS trades.</li>
                <li><b>DIGIT MATCHES:</b> Manual trade betting the next digit equals your barrier.</li>
                <li><b>DIGIT DIFFERS:</b> Manual trade betting the next digit is not your barrier.</li>
                <li><b>INSTA 5:</b> Places five DIFFERS trades instantly on the current barrier.</li>
                <li><b>kidgambleX:</b> Automatically selects the three most frequent digits and places MATCHES trades on them. (One-click execution)</li>
                <li><b>sludgeX AUTO:</b> Automated DIFFERS trades on a set of digits when conditions are met.</li>
                <li><b>tripleX AUTO:</b> Rotates through a sequence of digits, placing a DIFFERS trade each time the target digit appears.</li>
                <li><b>kidX:</b> Waits for the selected barrier digit to appear, then places three DIFFERS trades over the next five ticks.</li>
                <li><b>MultiG:</b> Queues a digit with a low appearance rate, holds for 30 seconds, then places a DIFFERS trade if the digit remains rare.</li>
                <li><b>Master Auto:</b> Enables/disables sludgeX, tripleX, and kidX (MultiG works independently).</li>
            </ul>
            <div style="margin-top:8px; font-size:11px; color:#ef4444; text-align:center;">
                ⚠️ For professional use only
            </div>
        `;
    }
    return `
        <div style="color:#94a3b8; margin-bottom:8px;">
            HUMAN mode – multiplier trading with order block logic.
        </div>
        <ul>
            <li><b>Stake:</b> Your trade amount.</li>
            <li><b>TP / SL:</b> Set take-profit and stop-loss in USD. AUTO SL toggles automatic stop-loss.</li>
            <li><b>humanX (Order Block Trade):</b> One-click execution of the order block strategy. It waits for a valid setup (breakout, retrace, confirmation) before placing a multiplier trade.</li>
            <li><b>Chart:</b> Displays the last 24 hours of 1-hour candles, with horizontal lines for the current range high/low. Updates live.</li>
        </ul>
    `;
}

function refreshHowTo(){
    howtoBadge.innerText = activeProfile;
    howtoBody.innerHTML = getHowToHTMLForProfile(activeProfile);
}

function toggleHowTo(){
    howtoVisible = !howtoVisible;
    if(howtoVisible){
        howtoBody.style.display = "block";
        howtoToggleBtn.innerText = "HIDE";
    }else{
        howtoBody.style.display = "none";
        howtoToggleBtn.innerText = "SHOW";
    }
}

// ================== TOAST ==================
function showToast(message, type="info"){
    const container = document.getElementById("toastContainer");

    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerText = message;

    container.appendChild(toast);

    setTimeout(()=>toast.classList.add("show"), 50);

    setTimeout(()=>{
        toast.classList.remove("show");
        setTimeout(()=>toast.remove(), 400);
    }, 3500);
}

// ================== DIGIT GRID ==================
function initDigitGrid(){
    if(!digitGrid) return;

    digitGrid.innerHTML = "";
    for(let i=0;i<10;i++){
        const div = document.createElement("div");
        div.className = "digit-cell";
        div.id = `digit-${i}`;
        div.innerHTML = `
            <div style="font-size:1.6rem; font-weight:bold; color:#38bdf8;">${i}</div>
            <div id="percent-${i}" style="color:#94a3b8;">0%</div>
        `;
        div.addEventListener("click", (ev) => onDigitClicked(i, ev));
        digitGrid.appendChild(div);
    }
}

function updateInsta5Label(){
    if(!insta5Btn || !barrierInput) return;
    const b = parseInt(barrierInput.value || "5", 10);
    insta5Btn.innerText = `INSTA 5 ON ${isNaN(b) ? 5 : b}`;
}

function onDigitClicked(digit, ev){

// ================== DIFFERS ANALYSIS (OLD UI STYLE) ==================
function renderDiffersAnalysis(da){
    if(!differsDigitsRow) return;

    if(!da){
        differsDigitsRow.innerHTML = "";
        return;
    }

    const green = da.green_digits || [];
    const golden = da.golden_digits || [];

    const all = [];
    golden.forEach(d => all.push({digit:d, type:"gold"}));
    green.forEach(d => {
        if(!golden.includes(d)) all.push({digit:d, type:"green"});
    });

    if(all.length === 0){
        differsDigitsRow.innerHTML = `<div style="color:#64748b; font-size:12px;">No low-frequency digits detected yet.</div>`;
        return;
    }

    differsDigitsRow.innerHTML = "";
    all.forEach(item=>{
        const div = document.createElement("div");
        div.style.padding = "8px 10px";
        div.style.borderRadius = "10px";
        div.style.fontWeight = "bold";
        div.style.border = "1px solid #334155";
        div.style.minWidth = "44px";
        div.style.textAlign = "center";

        if(item.type === "gold"){
            div.style.background = "linear-gradient(135deg,#facc15,#f59e0b)";
            div.style.color = "#0b1220";
            div.style.boxShadow = "0 0 14px rgba(250,204,21,0.35)";
            div.title = "Golden differs: absent for 20 ticks, then printed again.";
        }else{
            div.style.background = "rgba(34,197,94,0.15)";
            div.style.color = "#22c55e";
            div.style.boxShadow = "0 0 12px rgba(34,197,94,0.20)";
            div.title = "Low-frequency differs digit.";
        }

        div.innerText = item.digit;
        differsDigitsRow.appendChild(div);
    });
}

function prettyType(t){
    const x = (t || "").toUpperCase();
    if(x === "OVER") return "OVER";
    if(x === "UNDER") return "UNDER";
    if(x === "MATCHES") return "MATCH";
    if(x === "DIFFERS") return "DIFFER";
    return t || "TRADE";
}

    balanceDisplay.innerText = Number(data.balance).toFixed(2);
});

socket.on("tick", (data)=>{
    if(!apiConnected) return;

    tickCountEl.innerText = data.tick_count;

    digitBuffer.push(data.digit);
    if(digitBuffer.length > 20) digitBuffer.shift();

    digitStream.innerHTML = digitBuffer.join(" ");
    lastDigitBox.innerText = data.digit;

    for(let i=0;i<10;i++){
        const cell = document.getElementById(`digit-${i}`);
        if(cell) cell.classList.remove("flash");
    }

    const activeCell = document.getElementById(`digit-${data.digit}`);
    if(activeCell){
        activeCell.classList.add("flash");
        setTimeout(()=>activeCell.classList.remove("flash"), 250);
    }
});

socket.on("digit_analysis", (data)=>{
    if(data.percentages){
        for(let i=0;i<10;i++){
            const p = document.getElementById(`percent-${i}`);
            if(p){
                p.innerText = (data.percentages[i] ?? 0) + "%";
            }
        }
    }

    if(activeProfile === "JOKERJOE" && data.differs_analysis){
        renderDiffersAnalysis(data.differs_analysis);
    }else{
        if(differsDigitsRow) differsDigitsRow.innerHTML = "";
    }

    if(data.confidence && activeProfile === "KOOLKID"){
        if(confOver1) confOver1.style.width = data.confidence.over1 + "%";
        if(confOver2) confOver2.style.width = data.confidence.over2 + "%";
        if(confUnder8) confUnder8.style.width = data.confidence.under8 + "%";
        if(confUnder9) confUnder9.style.width = data.confidence.under9 + "%";

        if(confOver1Text) confOver1Text.innerText = data.confidence.over1;
        if(confOver2Text) confOver2Text.innerText = data.confidence.over2;
        if(confUnder8Text) confUnder8Text.innerText = data.confidence.under8;
        if(confUnder9Text) confUnder9Text.innerText = data.confidence.under9;
    }

    // ✅ JOKERJOE MultiG countdown shown inside TRADE HISTORY
    if(activeProfile === "JOKERJOE"){
        const row = document.getElementById("multigCountdownRow");
        if(row){
            const mp = data.multig_pending;
            if(mp && mp.active){
                row.style.display = "block";
                const dEl = document.getElementById("multigDigit");
                const sEl = document.getElementById("multigSecs");
                if(dEl) dEl.innerText = mp.barrier;
                if(sEl) sEl.innerText = mp.seconds_remaining;
            }else{
                row.style.display = "none";
            }
        }
    }
});

// HUMAN chart data
socket.on("human_chart_data", (data)=>{
    if(activeProfile !== "HUMAN") return;
    if (window.updateHumanChart) window.updateHumanChart(data);
});

socket.on("trade_placed", (data)=>{
    const t = prettyType(data.type);
    const b = (data.barrier !== undefined && data.barrier !== null) ? ` ${data.barrier}` : "";
    const s = (data.stake !== undefined && data.stake !== null) ? ` $${Number(data.stake).toFixed(2)}` : "";
    showToast(`✅ ${t}${b} placed${s}`, "success");
});

socket.on("trade_result", (data)=>{
    pushTradeToStore(data);

    if((data.profile || activeProfile).toUpperCase() === activeProfile){
        const list = document.getElementById("profileTradeList");
        if(list){
            if (list.children.length === 1 && list.children[0].innerText.includes('No trades')) {
                list.innerHTML = '';
            }
            list.prepend(buildTradeItem(data));
        }
    }

    const result = (data.result || "LOSS").toUpperCase();
    const profit = typeof data.profit === "number" ? data.profit : (data.profit_value || 0);
    if(result === "WIN"){
        showToast(`🏆 WIN +$${Math.abs(profit).toFixed(2)}`, "success");
    }else{
        showToast(`❌ LOSS -$${Math.abs(profit).toFixed(2)}`, "error");
    }
});

socket.on("stats_update", (data)=>{
    const pnl = data.net_pnl || 0;
    netPnlBox.innerText = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
    netPnlBox.style.color = pnl >= 0 ? "#22c55e" : "#ef4444";

    const btn = document.getElementById("autoBtn");
    if(btn){
        if(data.auto_trade){
            btn.innerText = "AUTO ON";
            btn.style.background = "#22c55e";
        }else{
            btn.innerText = "AUTO OFF";
            btn.style.background = "#38bdf8";
        }
    }

    const totalEl = document.getElementById("profileTotalTrades");
    if (totalEl) {
        totalEl.innerText = (data.wins + data.losses);
        document.getElementById("profileWins").innerText = data.wins;
        document.getElementById("profileLosses").innerText = data.losses;
        document.getElementById("profileWinRate").innerText = data.winrate + "%";
        document.getElementById("profileLossRate").innerText = (100 - data.winrate).toFixed(1) + "%";
    }
});

// DEFAULT LOAD
setProfile("KOOLKID");
</script>

</body>
</html>
