<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - KoolKid Bot</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/static/images/favicon.png">

  <style>
    body{
      background:linear-gradient(135deg,#0f172a,#020617);
      font-family:Arial, sans-serif;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
      padding:16px;
    }
    .card{
      background:#111827;
      padding:30px;
      border-radius:15px;
      width:380px;
      box-shadow:0 0 25px rgba(0,0,0,0.6);
      text-align:center;
      border:1px solid #1f2937;
    }
    h2{
      color:#a855f7;
      text-shadow:0 0 15px #a855f7;
      margin-top:0;
    }
    .muted{
      color:#cbd5e1;
      font-size:13px;
      line-height:1.35;
      margin:-4px 0 10px;
    }
    input{
      width:90%;
      padding:12px;
      margin:10px 0;
      border-radius:10px;
      border:none;
      background:#1f2937;
      color:white;
      font-size:15px;
      outline:none;
      box-sizing:border-box;
    }
    input:focus{
      box-shadow:0 0 0 2px rgba(168,85,247,0.35);
    }
    button{
      width:95%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      background:#a855f7;
      color:white;
      font-size:16px;
      transition:0.2s;
    }
    button:hover{
      transform:scale(1.03);
    }
    .password-wrap{
      position:relative;
      width:90%;
      margin:10px auto 0 auto;
    }
    .password-wrap input{
      width:100%;
      margin:0;
      padding-right:46px;
    }
    .toggle-eye{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      width:auto;
      margin:0;
      padding:4px;
      background:transparent;
      border:none;
      color:#cbd5e1;
      cursor:pointer;
      font-size:18px;
      line-height:1;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .toggle-eye:hover{
      transform:translateY(-50%) scale(1.08);
      color:white;
    }
    .toggle-eye:focus-visible{
      outline:2px solid #a855f7;
      border-radius:6px;
    }
    .error{
      color:#ef4444;
      font-weight:bold;
      margin-top:10px;
    }
    .tip{
      margin-top:10px;
      font-size:12px;
      color:#93c5fd;
    }
    a{
      color:#38bdf8;
      text-decoration:none;
      font-weight:bold;
    }
    @media (max-width:480px){
      .card{padding:22px 16px; width:100%; box-sizing:border-box;}
      input, .password-wrap, button{width:100%;}
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>📝 Register</h2>
    <p class="muted">New users need a valid license key to create an account.</p>

    <form method="POST">
      <input type="text" name="username" placeholder="Choose Username" required />
      <div class="password-wrap">
        <input type="password" id="registerPassword" name="password" placeholder="Choose Password" required />
        <button type="button" class="toggle-eye" data-toggle-password="registerPassword" aria-label="Show password" title="Show/Hide password">👀</button>
      </div>
      <input type="text" name="license_key" placeholder="License Key (required)" required style="text-transform:uppercase;" />
      <button type="submit">Create Account</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

            <p class="tip">Monthly, beta tester, and Lifetime keys are created by admin.</p>

    <p style="margin-top:15px;">
      Already have an account? <a href="/login">Login</a>
    </p>
  </div>
  <script>
    function togglePasswordVisibility(targetId, btn){
      const input = document.getElementById(targetId);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      if (btn) {
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        btn.textContent = show ? '🙈' : '👀';
      }
    }
    document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
      btn.addEventListener('click', () => togglePasswordVisibility(btn.dataset.togglePassword, btn));
      btn.addEventListener('touchend', (ev) => {
        ev.preventDefault();
        togglePasswordVisibility(btn.dataset.togglePassword, btn);
      }, { passive:false });
    });
  </script>
</body>
</html>
